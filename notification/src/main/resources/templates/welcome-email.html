<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6;">

<h2>Welcome, <span th:text="${username}">User</span> 🎉</h2>

<p>
    Hi <b th:text="${username}"></b>,
</p>

<p>
    We're excited to have you on board!
</p>

<p>
    Your account has been successfully created with:
</p>

<ul>
    <li><b>Username:</b> <span th:text="${username}"></span></li>
    <li><b>Email:</b> <span th:text="${email}"></span></li>
</ul>

<p>
    You can now log in and start exploring the platform.
</p>

<br/>

<p>Best Regards,<br/>Security Service Team</p>

</body>
</html>
